services:
  client:
    build: ./client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    env_file:
      - ./client/.env

  server:
    build: ./server

    ports:
      - "5000:5000"

    volumes:
      - ./server:/app
      - /app/node_modules

    env_file:
      - ./server/.env

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: postgres_container

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
